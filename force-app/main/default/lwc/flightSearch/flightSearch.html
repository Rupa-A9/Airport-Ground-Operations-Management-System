<template>

    <lightning-card title="Flight Search" icon-name="standard:flight">

        <div class="slds-p-around_medium">

            <lightning-input
                label="Flight Number"
                value={searchKey}
                onchange={handleChange}>
            </lightning-input>

            <br/>

            <lightning-button
                label="Search"
                variant="brand"
                onclick={handleSearch}>
            </lightning-button>

        </div>

        <template if:true={flights}>

            <lightning-datatable
                key-field="Id"
                data={flights}
                columns={columns}>
            </lightning-datatable>

        </template>

    </lightning-card>

</template>
