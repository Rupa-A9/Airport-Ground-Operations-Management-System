
<template>

    <lightning-card
        title="Ground Service Tasks"
        icon-name="standard:task">

        <div class="slds-p-around_medium">

            <!-- Loading State -->
            <template if:true={isLoading}>

                <lightning-spinner
                    alternative-text="Loading ground service tasks"
                    size="medium">
                </lightning-spinner>

            </template>


            <!-- Error State -->
            <template if:true={errorMessage}>

                <div class="slds-text-color_error slds-p-around_medium">
                    {errorMessage}
                </div>

            </template>


            <template if:true={showEmptyState}>

                <c-empty-state
                    title="No Ground Service Tasks"
                    message="There are no ground service tasks available right now.">
                </c-empty-state>

            </template>


            <!-- Task List -->
            <template if:true={showTasks}>

                <div class="slds-grid slds-wrap slds-gutters">

                    <template
                        for:each={tasks}
                        for:item="task">

                        <div
                            key={task.Id}
                            class="slds-col
                                   slds-size_1-of-1
                                   slds-medium-size_1-of-2
                                   slds-large-size_1-of-3
                                   slds-m-bottom_medium">

                            <c-ground-task-card
                                task={task}
                                processing-task-id={processingTaskId}
                                oncompletetask={handleCompleteTask}
                                onviewdetails={handleViewDetails}>
                            </c-ground-task-card>

                        </div>

                    </template>

                </div>

            </template>


            <!-- Selected Task Details -->
            <template if:true={selectedTask}>

                <div class="slds-m-top_medium">

                    <c-ground-task-details
                        task={selectedTask}>
                    </c-ground-task-details>

                </div>

            </template>

        </div>

    </lightning-card>

</template>
